
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <h1>Student AI Assistant</h1>
    <p class="subtitle">Your personal learning assistant</p>

    <div id="chat-box">
      <div class="message bot">Hello! How can I help you?</div>
    </div>

    <form id="chat-form">
      <input id="message-input"
             type="text"
             placeholder="Enter your question..."
             required>
      <button type="submit" id="send-button">Send</button>
    </form>

    <p id="status"></p>

    <hr>

    <h3>Chat History</h3>

    <div class="history-buttons">
      <button type="button" id="history-button">View History</button>
      <button type="button" id="clear-button">Clear History</button>
    </div>

    <div id="history-box"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
